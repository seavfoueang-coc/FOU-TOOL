    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter"
      try {
        let _customFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _customFetch;
          },
          set(val) {
            _customFetch = val;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}
    </script>
